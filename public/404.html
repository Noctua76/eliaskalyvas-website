<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#05080c" />
  <title>404 — Elias Kalyvas</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 75% 20%,#10293a 0,#071019 38%,#05080c 72%);color:#edf3f7}
    main{width:min(760px,calc(100% - 40px));padding:64px 0}
    .mark{font-size:.78rem;letter-spacing:.28em;color:#8fa2b1}
    h1{font-size:clamp(4.6rem,15vw,9rem);line-height:.9;margin:22px 0 16px;font-weight:300;letter-spacing:-.05em}
    p{max-width:560px;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.7;color:#aebbc5}
    nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
    a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:1px solid #354653;color:#eef5f9;text-decoration:none;letter-spacing:.04em}
    a:hover,a:focus-visible{border-color:#91b6cf;background:#0e1c27;outline:none}
    small{display:block;margin-top:48px;color:#718390;letter-spacing:.08em}
  </style>
</head>
<body>
  <main>
    <div class="mark">ELIAS KALYVAS / 404</div>
    <h1>Page not found.</h1>
    <p>The address may have changed or the page may no longer exist. Choose the English or Greek site to continue.</p>
    <nav aria-label="Choose language">
      <a id="home-en" href="/en/" lang="en">English site ⟶</a>
      <a id="home-gr" href="/gr/" lang="el">Ελληνικό site ⟶</a>
    </nav>
    <small>IDEAS · PEOPLE · BUSINESS · TECHNOLOGY</small>
  </main>
  <script>
    (() => {
      if (!location.hostname.endsWith('.github.io')) return;
      const first = location.pathname.split('/').filter(Boolean)[0];
      if (!first) return;
      const base = '/' + first + '/';
      document.getElementById('home-en').href = base + 'en/';
      document.getElementById('home-gr').href = base + 'gr/';
    })();
  </script>
</body>
</html>
