name: Nyra isolated native acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/nyra-native-acceptance.yml'
      - 'ops/native-acceptance/**'
      - 'lib/publication/**'
      - 'supabase/migrations/**'
      - 'test/**'
      - 'package*.json'
permissions:
  contents: read
concurrency:
  group: nyra-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'test/nyra-phase5a-native-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci
      - name: Install locked native test driver
        run: npm ci --ignore-scripts --prefix ops/native-acceptance
      - name: Native isolated acceptance
        env:
          NYRA_NATIVE_CI: '1'
          NYRA_TEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ops/native-acceptance/edge-diagnostic.mjs
      - name: Sanitized native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nyra-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-results/
          if-no-files-found: warn
          retention-days: 7
  regression:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'test/nyra-phase5a-native-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - name: Existing regression suite
        run: npm test
      - name: Clean normal production build
        run: npm run build
      - name: Normal build publication isolation
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync,existsSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const files=readdirSync('dist',{recursive:true,withFileTypes:true}).filter(x=>x.isFile()).map(x=>x.parentPath+'/'+x.name);
          assert(!existsSync('dist/.well-known/nyra-release.json'));
          for(const file of files)assert(!/PRIVATE_NATIVE_|SYNTHETIC_PHASE3_PUBLIC_TEST|nyra_delivery_receipt|native-results/.test(readFileSync(file).toString()),file);
          console.log(JSON.stringify({normalFiles:files.length,publicationWitness:false,fixtureLeak:false}));
          NODE
