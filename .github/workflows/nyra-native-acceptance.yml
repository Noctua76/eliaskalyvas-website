name: Nyra isolated native acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: nyra-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'test/nyra-phase5a-native-acceptance' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci
      - name: Existing regression suite
        run: npm test
      - name: Clean normal production build
        run: npm run build
      - name: Install locked native test driver
        run: npm ci --ignore-scripts --prefix ops/native-acceptance
      - name: Native isolated acceptance
        env:
          NYRA_NATIVE_CI: '1'
        run: node ops/native-acceptance/run.mjs
      - name: Sanitized native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nyra-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-results/
          if-no-files-found: warn
          retention-days: 7
